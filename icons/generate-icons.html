<!DOCTYPE html>
<html>
<head>
  <title>PWRFlow Notate Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }
    .icon-preview {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    canvas {
      border: 2px solid #333;
      background: white;
    }
    button {
      margin: 10px 5px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>PWRFlow Notate Icon Generator</h1>
  <p>This generates the extension icons. Right-click each canvas and "Save image as..."</p>

  <div class="icon-preview">
    <div>
      <canvas id="icon16" width="16" height="16"></canvas>
      <p>16x16</p>
    </div>
    <div>
      <canvas id="icon32" width="32" height="32"></canvas>
      <p>32x32</p>
    </div>
    <div>
      <canvas id="icon48" width="48" height="48"></canvas>
      <p>48x48</p>
    </div>
    <div>
      <canvas id="icon128" width="128" height="128"></canvas>
      <p>128x128</p>
    </div>
  </div>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;

      // Clear canvas
      ctx.clearRect(0, 0, size, size);

      // Create gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');

      // Draw rounded rectangle background
      const radius = size * 0.2;
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fill();

      // Draw pencil/note icon
      const scale = size / 128;
      ctx.fillStyle = 'white';

      // Paper
      ctx.fillRect(25 * scale, 20 * scale, 60 * scale, 80 * scale);

      // Lines on paper
      ctx.strokeStyle = '#667eea';
      ctx.lineWidth = 2 * scale;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(35 * scale, (35 + i * 15) * scale);
        ctx.lineTo(75 * scale, (35 + i * 15) * scale);
        ctx.stroke();
      }

      // Pencil
      ctx.save();
      ctx.translate(80 * scale, 70 * scale);
      ctx.rotate(Math.PI / 4);

      // Pencil body
      const pencilGradient = ctx.createLinearGradient(0, -5 * scale, 0, 35 * scale);
      pencilGradient.addColorStop(0, '#ffd700');
      pencilGradient.addColorStop(1, '#ff8c00');
      ctx.fillStyle = pencilGradient;
      ctx.fillRect(-5 * scale, -5 * scale, 10 * scale, 40 * scale);

      // Pencil tip
      ctx.fillStyle = '#8b4513';
      ctx.beginPath();
      ctx.moveTo(-5 * scale, 35 * scale);
      ctx.lineTo(0, 45 * scale);
      ctx.lineTo(5 * scale, 35 * scale);
      ctx.closePath();
      ctx.fill();

      // Pencil eraser
      ctx.fillStyle = '#ff69b4';
      ctx.fillRect(-5 * scale, -10 * scale, 10 * scale, 5 * scale);

      ctx.restore();
    }

    // Draw all icon sizes
    ['icon16', 'icon32', 'icon48', 'icon128'].forEach(id => {
      const canvas = document.getElementById(id);
      drawIcon(canvas);
    });

    // Add download functionality
    document.querySelectorAll('canvas').forEach(canvas => {
      canvas.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = canvas.id + '.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    });
  </script>
</body>
</html>
